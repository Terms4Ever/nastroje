name: Kontrola README, dokumentace a migrací

# Volá se z ostatních repozitářů jedním odkazem, takže pravidla žijí
# na jednom místě:
#
#   jobs:
#     readme:
#       uses: Terms4Ever/nastroje/.github/workflows/readme.yml@main
#
on:
  workflow_call:

permissions:
  contents: read

jobs:
  kontrola:
    # Verze je připnutá schválně. Obraz ubuntu-24.04 má PHP 8.3 předinstalované,
    # takže tenhle běh nepotřebuje jediný instalační krok a trvá vteřiny.
    runs-on: ubuntu-24.04

    steps:
      - name: Stáhnout projekt
        uses: actions/checkout@v7
        with:
          # Kontrola dokumentace porovnává rozsah commitů, takže potřebuje
          # historii, ne jen poslední commit.
          fetch-depth: 0

      - name: Stáhnout kontrolu
        uses: actions/checkout@v7
        with:
          repository: Terms4Ever/nastroje
          path: .nastroje

      - name: Ověřit, že je čím kontrolovat
        run: php --version

      - name: Zkontrolovat README
        run: php .nastroje/kontrola-readme.php "$GITHUB_WORKSPACE"

      - name: Zkontrolovat dokumentaci
        env:
          ZAKLAD: ${{ github.event.before }}
          CIL: ${{ github.sha }}
        run: |
          # Při pull requestu a při první vlně commitů na nové větvi žádný
          # použitelný základ není. Tehdy se ověří jen obsah dokumentů.
          if [ -n "$ZAKLAD" ] && [ "$ZAKLAD" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$ZAKLAD^{commit}" 2>/dev/null; then
            php .nastroje/kontrola-dokumentace.php "$GITHUB_WORKSPACE" "$ZAKLAD" "$CIL"
          else
            php .nastroje/kontrola-dokumentace.php "$GITHUB_WORKSPACE"
          fi

      - name: Zkontrolovat migrace databáze
        env:
          ZAKLAD: ${{ github.event.before }}
          CIL: ${{ github.sha }}
        run: |
          # Stejné pravidlo jako u dokumentace: bez použitelného základu se
          # ověří jen tvar migrací a přehled.
          if [ -n "$ZAKLAD" ] && [ "$ZAKLAD" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$ZAKLAD^{commit}" 2>/dev/null; then
            php .nastroje/kontrola-migraci.php "$GITHUB_WORKSPACE" "$ZAKLAD" "$CIL"
          else
            php .nastroje/kontrola-migraci.php "$GITHUB_WORKSPACE"
          fi
