name: Kontrola README, dokumentace, migrací a issues

# Volá se z ostatních repozitářů jedním odkazem, takže pravidla žijí
# na jednom místě:
#
#   jobs:
#     readme:
#       uses: Terms4Ever/nastroje/.github/workflows/readme.yml@main
#
on:
  workflow_call:

# Prava se neomezuji tady, ale ve volajicim workflow: kontrola issues
# potrebuje issues: read, kontrola README jen contents: read. Kdyby si tenhle
# soubor vynutil issues: read, spadl by kazdy volajici, ktery ho nedava.

jobs:
  kontrola:
    # Verze je připnutá schválně. Obraz ubuntu-24.04 má PHP 8.3 předinstalované,
    # takže tenhle běh nepotřebuje jediný instalační krok a trvá vteřiny.
    runs-on: ubuntu-24.04

    steps:
      # Akce jsou připnuté na otisk commitu, ne na značku verze: značku jde
      # přesunout na jiný kód, otisk ne (N33). Přihlašovací údaje se po
      # stažení v gitu nenechávají, kontroly je nepotřebují.
      - name: Stáhnout projekt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Kontrola dokumentace porovnává rozsah commitů, takže potřebuje
          # historii, ne jen poslední commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Stáhnout kontrolu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Terms4Ever/nastroje
          path: .nastroje
          persist-credentials: false

      - name: Ověřit, že je čím kontrolovat
        run: php --version

      - name: Zkontrolovat README
        run: php .nastroje/kontrola-readme.php "$GITHUB_WORKSPACE"

      - name: Určit rozsah změn
        id: rozsah
        env:
          UDALOST: ${{ github.event_name }}
          PRED: ${{ github.event.before }}
          PR_ZAKLAD: ${{ github.event.pull_request.base.sha }}
          VYCHOZI: ${{ github.event.repository.default_branch }}
        run: |
          # Proti čemu se měří, jestli dávka sáhla na dokumentaci a jestli
          # nemění hotové migrace. Dřív se bral jen github.event.before: u pull
          # requestu neexistuje a u první vlny commitů na nové větvi je samá
          # nula, takže se obě pravidla tiše neuplatnila (audit 23. 9. 2026, N32).
          NULY=0000000000000000000000000000000000000000
          ZAKLAD=""
          case "$UDALOST" in
            pull_request)
              # Checkout je slučovací commit a jeho první rodič je základ PR,
              # takže rozsah ukáže přesně to, co pull request přinese.
              ZAKLAD="$PR_ZAKLAD"
              ;;
            push)
              if [ -n "$PRED" ] && [ "$PRED" != "$NULY" ] && git cat-file -e "$PRED^{commit}" 2>/dev/null; then
                ZAKLAD="$PRED"
              elif [ -n "$VYCHOZI" ] && git rev-parse -q --verify "origin/$VYCHOZI" >/dev/null; then
                # Nová větev, nebo push přes vynucený přepis historie: měří se
                # od společného předka s výchozí větví.
                ZAKLAD=$(git merge-base "origin/$VYCHOZI" "$GITHUB_SHA" || true)
                if [ "$ZAKLAD" = "$GITHUB_SHA" ]; then ZAKLAD=""; fi
                if [ -n "$PRED" ] && [ "$PRED" != "$NULY" ]; then
                  echo "::warning::Předchozí commit $PRED v historii není (přepis historie?), měří se od společného předka s $VYCHOZI."
                fi
              fi
              ;;
          esac
          if [ -n "$ZAKLAD" ] && ! git cat-file -e "$ZAKLAD^{commit}" 2>/dev/null; then
            echo "::error::Základ rozsahu $ZAKLAD v klonu není, pravidla o dávce nejde ověřit."
            exit 1
          fi
          if [ -n "$ZAKLAD" ]; then
            echo "Rozsah změn: $ZAKLAD..$GITHUB_SHA"
          else
            echo "::notice::Rozsah změn není ($UDALOST), ověří se jen obsah dokumentů a migrací."
          fi
          echo "zaklad=$ZAKLAD" >> "$GITHUB_OUTPUT"

      - name: Zkontrolovat dokumentaci
        env:
          ZAKLAD: ${{ steps.rozsah.outputs.zaklad }}
        run: |
          if [ -n "$ZAKLAD" ]; then
            php .nastroje/kontrola-dokumentace.php "$GITHUB_WORKSPACE" "$ZAKLAD" "$GITHUB_SHA"
          else
            php .nastroje/kontrola-dokumentace.php "$GITHUB_WORKSPACE"
          fi

      - name: Zkontrolovat migrace databáze
        env:
          ZAKLAD: ${{ steps.rozsah.outputs.zaklad }}
        run: |
          if [ -n "$ZAKLAD" ]; then
            php .nastroje/kontrola-migraci.php "$GITHUB_WORKSPACE" "$ZAKLAD" "$GITHUB_SHA"
          else
            php .nastroje/kontrola-migraci.php "$GITHUB_WORKSPACE"
          fi

      - name: Zkontrolovat issues
        env:
          # gh si token bere odsud. Volající workflow mu musí dát issues: read.
          GH_TOKEN: ${{ github.token }}
        run: php .nastroje/kontrola-issues.php "$GITHUB_WORKSPACE"
