name: Kontroly

on:
  push:
  pull_request:

# Token nesmi vic, nez je potreba ke cteni repozitare. Volany workflow
# zije v Terms4Ever/nastroje a odkazuje se na nej vetvi, ne otiskem,
# zamerne, aby se pravidla menila na jednom miste. Tohle omezeni je
# pojistka pro pripad, ze by se ta vetev zmenila.
permissions:
  contents: read
  issues: read

jobs:
  readme:
    uses: Terms4Ever/nastroje/.github/workflows/readme.yml@main

  # Regresní testy kontrol: každá díra z auditu 23. 9. 2026 má případ, který
  # ji shodí. Bez nich se nepozná, že kontrola přestala fungovat (N32).
  testy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Spouštěč migrací se zkouší na skutečné databázi. Běhové prostředí má
      # MySQL předinstalovanou, stačí ji pustit (uživatel root, heslo root).
      - name: Jednorázová databáze
        run: |
          sudo systemctl start mysql.service
          php -m | grep -qi pdo_mysql
      - name: Testy kontrol
        env:
          NASTROJE_TEST_MYSQL: "mysql:host=127.0.0.1;port=3306|root|root"
        run: php tests/spust.php
