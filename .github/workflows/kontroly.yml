name: Kontroly

on:
  push:
  pull_request:

# Token nesmi vic, nez je potreba ke cteni repozitare. Volany workflow
# zije v Terms4Ever/nastroje a odkazuje se na nej vetvi, ne otiskem,
# zamerne, aby se pravidla menila na jednom miste. Tohle omezeni je
# pojistka pro pripad, ze by se ta vetev zmenila.
permissions:
  contents: read
  issues: read

jobs:
  readme:
    name: Pravidla nastroje
    uses: Terms4Ever/nastroje/.github/workflows/readme.yml@main

  # Regresní testy kontrol: každá díra z auditu 23. 9. 2026 má případ, který
  # ji shodí. Bez nich se nepozná, že kontrola přestala fungovat (N32).
  testy:
    name: Testy kontrol (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Spouštěč migrací se zkouší na skutečné databázi. Běhové prostředí má
      # MySQL předinstalovanou, stačí ji pustit (uživatel root, heslo root).
      - name: Jednorázová databáze
        run: |
          sudo systemctl start mysql.service
          php -m | grep -qi pdo_mysql
      - name: Testy kontrol
        env:
          NASTROJE_TEST_MYSQL: "mysql:host=127.0.0.1;port=3306|root|root"
        run: php tests/spust.php

  # Stejné testy na Windows. Kontroly se pouštějí hlavně tam (pre-push hook,
  # hook Claude Code) a chyby specifické pro Windows byly nejčastější:
  # escapeshellarg, stříška v cmd.exe, cesty z Git Bashe. Sedm případů
  # (hook, cesta /c/...) běží jen tady (N33).
  testy-windows:
    name: Testy kontrol (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
      - name: Testy kontrol na Windows
        run: php tests/spust.php
