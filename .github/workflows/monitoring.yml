name: Monitoring čtyř webů
run-name: ${{ inputs.test_upozorneni && 'Zkouška e-mailového upozornění' || 'Hodinové měření čtyř webů' }}

on:
  schedule:
    - cron: '17 * * * *'
      timezone: Europe/Prague
  workflow_dispatch:
    inputs:
      test_upozorneni:
        description: 'Zkouška e-mailu: úmyslný neúspěch bez měření webů a bez commitu'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitoring-ctyr-webu
  cancel-in-progress: false

jobs:
  mereni:
    name: Změřit a uložit hodinový přehled
    # V soukromém repozitáři se runner vůbec nepřidělí a monitoring nečerpá minuty.
    if: github.repository == 'Terms4Ever/nastroje' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    env:
      TZ: Europe/Prague
    steps:
      - name: Stáhnout aktuální main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Ověřit nástroj bez sítě
        run: |
          php -r 'exit(extension_loaded("curl") && extension_loaded("openssl") ? 0 : 1);'
          php tests/spust.php monitoring

      - name: Vyzkoušet e-mailové upozornění bez změny webů a historie
        if: github.event_name == 'workflow_dispatch' && inputs.test_upozorneni
        run: |
          echo '## Zkouška e-mailového upozornění' >> "$GITHUB_STEP_SUMMARY"
          echo 'Úmyslný test oznámení GitHub Actions. Weby se neměřily a historie se nezměnila.' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::ZKOUŠKA UPOZORNĚNÍ: tento neúspěch je úmyslný test e-mailu, nikoli výpadek webů.'
          exit 1

      - name: Změřit jen chybějící hodinu
        id: mereni
        shell: bash
        run: |
          set +e
          php monitoring/kontrola.php --zapsat --pokud-chybi
          KOD=$?
          set -e
          if [ "$KOD" != 0 ] && [ "$KOD" != 2 ]; then exit "$KOD"; fi
          echo "kod=$KOD" >> "$GITHUB_OUTPUT"

      - name: Zapsat pouze měření a jeho dokumentaci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git add -- monitoring/vysledky docs/09-monitoring-webu.md
          if git diff --cached --quiet; then
            echo "Tato hodina už je změřená, další commit nevzniká."
            exit 0
          fi
          # Zápis do jiných cest je chyba, nikdy se nesmí přibalit k měření.
          git diff --cached --name-only | while IFS= read -r CESTA; do
            if [[ "$CESTA" != docs/09-monitoring-webu.md ]] && [[ ! "$CESTA" =~ ^monitoring/vysledky/[0-9]{4}-[0-9]{2}/[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}Z\.json$ ]]; then
              echo "::error::Nepovolená cesta pro automatický zápis."
              exit 1
            fi
          done
          git config user.name 'Tomáš Šaroun'
          git config user.email '74513653+Terms4Ever@users.noreply.github.com'
          git commit -m "Automatické měření čtyř webů $(date '+%F %H:%M %z')"
          gh auth setup-git
          # Žádný force push. Souběžný lidský commit se zachová; konflikt běh zastaví.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Zveřejnit přehled běhu
        if: always() && !inputs.test_upozorneni
        shell: bash
        run: |
          if [ -n '${{ steps.mereni.outputs.kod }}' ] && [ -f docs/09-monitoring-webu.md ]; then
            sed -n '/<!-- monitoring:zacatek -->/,/<!-- monitoring:konec -->/p' docs/09-monitoring-webu.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Měření v tomto běhu nebylo dokončeno. Starší přehled není výsledkem této kontroly; příčina je v neúspěšném kroku.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nález na webu oznámit až po uložení důkazu
        if: steps.mereni.outputs.kod == '2'
        run: |
          echo '::error::Měření zachytilo chybu nebo upozornění. Podrobnosti jsou v uloženém přehledu.'
          exit 1
