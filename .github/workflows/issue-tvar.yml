name: Tvar issue (sdílené)

# Volá se z ostatních repozitářů při události issues, aby se tvar poznal hned
# při zakládání, ne až u nejbližšího pushe:
#
#   on:
#     issues:
#       types: [opened, edited, closed]
#   jobs:
#     tvar:
#       uses: Terms4Ever/nastroje/.github/workflows/issue-tvar.yml@main
#
# Kontroluje tělo i zařazení (štítek druhu, odpovědný). Práva se neomezují
# tady, ale ve volajícím workflow: běh potřebuje issues: write, protože
# štítkuje a píše komentář.
on:
  workflow_call:

jobs:
  tvar:
    runs-on: ubuntu-24.04
    # Založení issue se štítkem a odpovědným pošle naráz tři události.
    # Platí poslední, starší běh se zruší, ať se štítek nepřehazuje.
    concurrency:
      group: tvar-issue-${{ github.repository }}-${{ github.event.issue.number }}
      cancel-in-progress: true

    steps:
      - name: Stáhnout kontrolu
        # Připnuto na otisk commitu, ne na značku (N33). Běh smí zapisovat
        # do issues, takže na tom, jaký kód se stáhne, záleží víc než jinde.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Terms4Ever/nastroje
          path: .nastroje
          persist-credentials: false

      - name: Zkontrolovat tvar
        id: tvar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CISLO: ${{ github.event.issue.number }}
          AKCE: ${{ github.event.action }}
        run: |
          # Filtr je vestavěný v gh (--jq), ať běh nestojí na externím jq.
          gh issue view "$CISLO" --json body --jq .body > telo.md
          STITKY=$(gh issue view "$CISLO" --json labels --jq '[.labels[].name] | join(",")')
          ODPOVEDNI=$(gh issue view "$CISLO" --json assignees --jq '[.assignees[].login] | join(",")')
          # Pole, ne řetězec: prázdný seznam štítků by se bez uvozovek ztratil
          # a PHP by za hodnotu vzalo další přepínač.
          ARGY=(--stitky "$STITKY" --odpovedni "$ODPOVEDNI")
          # Přísnost podle skutečného stavu, ne podle události: zavřené issue,
          # kterému někdo upraví text nebo štítek, pořád musí mít hotový
          # checklist. Dřív se to hlídalo jen v okamžiku zavření (N32).
          STAV=$(gh issue view "$CISLO" --json state --jq .state)
          if [ "$STAV" = "CLOSED" ]; then ARGY+=(--zavrene); fi
          # Pravidla zavedená později platí jen pro issue, které vzniklo po nich.
          VZNIK=$(gh issue view "$CISLO" --json createdAt --jq .createdAt)
          ARGY+=(--vznik "$VZNIK")
          if php .nastroje/kontrola-tvaru-issue.php telo.md "${ARGY[@]}" 2> nalezy.txt; then
            echo "sedi=ano" >> "$GITHUB_OUTPUT"
          else
            echo "sedi=ne" >> "$GITHUB_OUTPUT"
            cat nalezy.txt
          fi

      - name: Označit issue, které tvaru neodpovídá
        if: steps.tvar.outputs.sedi == 'ne'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CISLO: ${{ github.event.issue.number }}
          AKCE: ${{ github.event.action }}
        run: |
          gh label create "tvar nesedí" --color D93F0B --description "Issue neodpovídá standardu" --force
          gh issue edit "$CISLO" --add-label "tvar nesedí"
          # Komentář jen při založení a při zavření, ať každá úprava nepřidává
          # další. Pravidlo o pěti řádcích platí i pro tenhle komentář.
          if [ "$AKCE" = "opened" ] || [ "$AKCE" = "closed" ]; then
            {
              echo "Issue neodpovídá standardu:"
              grep '^  - ' nalezy.txt | head -3
              echo "Vzor: .github/ISSUE_TEMPLATE/ukol.md"
            } > komentar.md
            gh issue comment "$CISLO" --body-file komentar.md
          fi

      - name: Sundat štítek, když už tvar sedí
        if: steps.tvar.outputs.sedi == 'ano'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CISLO: ${{ github.event.issue.number }}
        run: gh issue edit "$CISLO" --remove-label "tvar nesedí" || true
